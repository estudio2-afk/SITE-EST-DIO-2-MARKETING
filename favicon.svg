<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Fundo branco -->
  <rect width="32" height="32" rx="4" fill="white"/>
  <!-- "2" em preto bold -->
  <text x="2" y="27" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#111111">2</text>
  <!-- Seta laranja para cima-direita (triângulo + linha) -->
